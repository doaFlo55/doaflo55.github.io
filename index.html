<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floss Integrations & Securities LLC | Command Center</title>
    <style>
        :root { 
            --bg-color: #000000; 
            --card-bg: #121212; 
            --border-color: #333333; 
            --text-color: #ffffff; 
            --neon-link: #00ffff; 
            --accent-gold: #FFD700;
            --accent-green: #00ff66;
            --bandlab-red: #ff3344;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding: 15px; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .dashboard-container { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 15px; 
            max-width: 1400px; 
            margin: auto; 
        }

        @media (max-width: 992px) {
            .dashboard-container { grid-template-columns: 1fr; }
            body { padding: 10px; }
        }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 20px; 
            margin-bottom: 15px;
            content-visibility: auto;
            contain-intrinsic-size: 200px;
        }
        
        h2 { 
            text-align: center; 
            color: #fff; 
            margin-top: 0; 
            font-size: 1.1em; 
            letter-spacing: 1px;
        }
        
        .account-title { 
            font-family: 'Courier New', monospace; 
            font-size: 0.85em; 
            color: #888; 
            margin-bottom: 5px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            text-align: center; 
        }

        .account-address { 
            font-family: 'Courier New', monospace; 
            font-size: 0.95em; 
            color: #fff; 
            word-break: break-all; 
            margin-bottom: 20px; 
            background: rgba(255,255,255,0.04); 
            padding: 12px; 
            border-left: 3px solid var(--accent-gold); 
            text-align: center; 
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.88em; }
        td { padding: 10px; border: 1px solid #222; color: #ccc; }
        strong { color: #fff; }
        a { color: var(--neon-link); text-decoration: none; text-shadow: 0 0 5px var(--neon-link); }
        
        .right-column { display: flex; flex-direction: column; gap: 15px; }

        /* BandLab Profile Card Styling */
        .bandlab-card {
            background: linear-gradient(135deg, #18080a 0%, #0a0a0a 100%);
            border: 1px solid var(--bandlab-red);
            text-align: center;
        }
